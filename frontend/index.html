<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChargeZone &middot; Inventory Control</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">
          <img src="assets/logo.png" alt="ChargeZone logo" />
        </div>
        <div class="brand-text">
          <h1>ChargeZone</h1>
          <p>Inventory Control</p>
        </div>
      </div>
      <form id="loginForm" onsubmit="event.preventDefault();">
        <label>Email
          <input type="email" id="loginEmail" autocomplete="username" required />
        </label>
        <label>Password
          <input type="password" id="loginPassword" autocomplete="current-password" required />
        </label>
        <div style="display:flex; justify-content:flex-end; margin-bottom:12px; margin-top:-4px">
          <button type="button" id="forgotPasswordBtn" class="btn-link" style="background:none; border:none; color:var(--brand, #E31E24); font-size:13px; font-weight:500; cursor:pointer; padding:0">Forgot password?</button>
        </div>
        <button type="submit" class="btn-primary">Sign in</button>
        <p id="loginError" class="form-error" hidden></p>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell" hidden>

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand-mark small">
          <img src="assets/logo.png" alt="ChargeZone logo" />
        </div>
        <div class="brand-text">
          <h1>ChargeZone</h1>
          <p>Inventory Control</p>
        </div>
      </div>

      <nav class="nav" id="mainNav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-dot"></span><span class="nav-label">Dashboard</span></button>
        <button class="nav-item region-admin-up" data-view="purchaseOrders"><span class="nav-dot"></span><span class="nav-label">Purchase Orders</span></button>
        <button class="nav-item" data-view="stockMove"><span class="nav-dot"></span><span class="nav-label">Scan &amp; Move Stock</span></button>
        <button class="nav-item" data-view="regionStock"><span class="nav-dot"></span><span class="nav-label">Region Stock Monitor</span></button>
        <button class="nav-item" data-view="requisitions"><span class="nav-dot"></span><span class="nav-label">Requisitions</span></button>
        <button class="nav-item" data-view="transactions"><span class="nav-dot"></span><span class="nav-label">Transactions</span></button>
        <button class="nav-item" data-view="materials"><span class="nav-dot"></span><span class="nav-label">Materials Master</span></button>
        <button class="nav-item region-admin-up" data-view="users"><span class="nav-dot"></span><span class="nav-label">Users &amp; Regions</span></button>
      </nav>

      <footer class="sidebar-bottom">
        <div class="user-chip" id="userChip" style="cursor: pointer;" title="View Profile">
          <div class="user-avatar" id="userAvatar">--</div>
          <div>
            <div class="user-name" id="userName">--</div>
            <div class="user-zone" id="userRegion">--</div>
          </div>
        </div>
        <button class="btn-ghost" id="logoutBtn">Sign out</button>
      </footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="navToggle" class="btn-ghost" aria-label="Toggle navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h2 id="viewTitle">Dashboard</h2>
        <div class="topbar-right" style="display:flex; align-items:center; gap:12px">
          <button class="btn-ghost" id="adminAlertsBtn" type="button" hidden>Alerts <span class="badge danger" id="adminAlertsCountBadge" hidden>0</span></button>
          <span class="badge role-badge" id="roleBadge">--</span>
        </div>
      </header>

      <div class="toast-stack" id="toastStack"></div>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-purchaseOrders" hidden></section>
      <section class="view" id="view-stockMove" hidden></section>
      <section class="view" id="view-regionStock" hidden></section>
      <section class="view" id="view-requisitions" hidden></section>
      <section class="view" id="view-transactions" hidden></section>
      <section class="view" id="view-materials" hidden></section>
      <section class="view" id="view-users" hidden></section>
      <section class="view" id="view-profile" hidden></section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/scan.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
